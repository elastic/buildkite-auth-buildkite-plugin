services:
  plugin-lint:
    image: buildkite/plugin-linter:v3.0.0@sha256:6ad2532e7763eb9a2f9d8f1700b3424e0ec4310721d90e10026f7e3bdfd06cd2
    command: ['--id', 'elastic/buildkite-auth', '--path', '/plugin']
    volumes:
      - ".:/plugin:ro"

  test:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ".:/plugin:ro"
    command: ['bats', 'tests/unit']

  shellcheck:
    image: koalaman/shellcheck-alpine:v0.11.0@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002
    entrypoint: ["sh", "-c"]
    command: ["find hooks -type f -exec shellcheck --shell=bash --external-sources --format=gcc {} +"]
    working_dir: /plugin
    volumes:
      - ".:/plugin:ro"
